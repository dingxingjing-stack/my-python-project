<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Avireon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <nav class="border-b border-gray-200 bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center">
      <a href="/" class="text-xl font-bold tracking-tight text-blue-700">Avireon</a>
    </div>
  </nav>
  <main class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
        <h1 class="text-2xl font-bold text-gray-900 text-center mb-2">Welcome back</h1>
        <p class="text-sm text-gray-500 text-center mb-8">Sign in to your Avireon account</p>
        <div id="error-msg" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-600"></div>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" name="email" required class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          </div>
          <button type="submit" class="w-full py-2.5 rounded-lg text-sm font-semibold text-white bg-blue-600 hover:bg-blue-500 transition shadow-sm">Sign In</button>
        </form>
        <p class="text-sm text-gray-500 text-center mt-6">
          Don't have an account? <a href="/register" class="text-blue-600 hover:text-blue-500 font-medium">Sign up</a>
        </p>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var email = this.email.value;
      var password = this.password.value;
      var errEl = document.getElementById('error-msg');
      fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email, password: password})
      }).then(function(r){
        return r.json().then(function(d){ return {status: r.status, data: d}; });
      }).then(function(resp){
        if (resp.status === 200 && resp.data && resp.data.data && resp.data.data.token) {
          localStorage.setItem('token', resp.data.data.token);
          localStorage.setItem('user', JSON.stringify(resp.data.data));
          window.location.href = '/console';
        } else {
          errEl.classList.remove('hidden');
          errEl.textContent = resp.data.detail || resp.data.error || 'Login failed';
        }
      }).catch(function(){
        errEl.classList.remove('hidden');
        errEl.textContent = 'Network error. Please try again.';
      });
    });
  </script>
</body>
</html>
