<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Avireon{% endblock %}</title>
  <meta name="description" content="{% block description %}Avireon - AI Music Creation Platform{% endblock %}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>[x-cloak] { display: none !important; }</style>
  {% block head %}{% endblock %}
</head>
<body x-data="app()" x-init="init()" class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
  <script>
    window.TRANSLATIONS = {{ translations_json|safe }};
    function app() {
      return {
        lang: localStorage.getItem('lang') || '{{ current_locale }}',
        translations: window.TRANSLATIONS || {},
        isLoggedIn: !!localStorage.getItem('token'),
        t(key) {
          const dict = this.translations[this.lang];
          return dict && dict[key] ? dict[key] : key;
        },
        setLang(l) {
          this.lang = l;
          localStorage.setItem('lang', l);
          document.cookie = 'lang=' + l + ';path=/;max-age=' + 365*86400;
          setTimeout(function() { window.location.reload(); }, 100);
        },
        logout() {
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          this.isLoggedIn = false;
          window.location.href = '/';
        },
        init() {
          this.isLoggedIn = !!localStorage.getItem('token');
        }
      };
    }
  </script>

  {% include "components/navbar.html" %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}

  {% block scripts %}{% endblock %}
</body>
</html>
