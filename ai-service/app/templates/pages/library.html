{% extends "base.html" %}
{% block content %}
<main class="flex-1 max-w-7xl mx-auto w-full px-6 py-8" x-data="library()">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-3xl font-bold">{{ _('My Library') }}</h1>
    <a href="/create" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white px-5 py-2.5 rounded-xl font-medium transition flex items-center gap-2">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      {{ _('New Creation') }}
    </a>
  </div>

  <!-- Tabs -->
  <div class="flex gap-1 mb-8 bg-gray-900 rounded-xl p-1 w-fit">
    <template x-for="t in tabs" :key="t.id">
      <button @click="activeTab = t.id; load()" :class="activeTab === t.id ? 'bg-purple-600 text-white' : 'text-gray-400 hover:text-white'"
              class="px-4 py-2 rounded-lg text-sm font-medium transition" x-text="t.label"></button>
    </template>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="text-center py-16">
    <div class="inline-block w-8 h-8 border-2 border-purple-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <!-- Empty state -->
  <div x-show="!loading && items.length === 0" class="text-center py-16">
    <svg class="w-16 h-16 mx-auto text-gray-700 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
    <p class="text-gray-500 text-lg mb-2" x-text="activeTab === 'drafts' ? 'No drafts yet' : 'No creations yet'"></p>
    <a href="/create" class="text-purple-400 hover:text-purple-300 transition">{{ _('Start creating →') }}</a>
  </div>

  <!-- Items Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <template x-for="item in items" :key="item.id">
      <div class="group bg-gray-900 rounded-xl overflow-hidden border border-gray-800 hover:border-gray-600 transition">
        <!-- Cover -->
        <a :href="`/creation/${item.id}`" class="block aspect-square bg-gray-800 relative overflow-hidden">
          <img x-show="item.cover_url" :src="item.cover_url" :alt="item.title" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
          <div x-show="!item.cover_url" class="w-full h-full flex items-center justify-center">
            <svg class="w-16 h-16 text-gray-700" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          </div>
          <!-- Draft badge -->
          <div x-show="item.status === 'draft'" class="absolute top-2 left-2 bg-yellow-600/80 text-white text-xs px-2 py-0.5 rounded-full">{{ _('Draft') }}</div>
          <!-- Play overlay -->
          <div x-show="item.audio_url" class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
            <div class="w-14 h-14 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center">
              <svg class="w-6 h-6 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        </a>
        <!-- Info -->
        <div class="p-4">
          <a :href="`/creation/${item.id}`">
            <h3 class="font-semibold truncate hover:text-purple-400 transition" x-text="item.title || 'Untitled'"></h3>
          </a>
          <p class="text-sm text-gray-500 mt-1" x-text="formatDate(item.created_at)"></p>
          <div class="flex items-center gap-3 mt-2 text-xs text-gray-500">
            <span x-text="formatDuration(item.duration_ms)"></span>
            <span>·</span>
            <span x-text="`${item.plays_count || 0} {{ _('plays') }}`"></span>
            <span>·</span>
            <span x-text="`❤ ${item.likes_count || 0}`"></span>
          </div>
          <!-- Actions -->
          <div class="flex items-center gap-2 mt-3 pt-3 border-t border-gray-800">
            <a :href="`/creation/${item.id}`" class="text-gray-400 hover:text-white transition text-sm">{{ _('Edit') }}</a>
            <button @click="shareItem(item)" class="text-gray-400 hover:text-white transition text-sm">{{ _('Share') }}</button>
            <button @click="deleteItem(item.id)" class="text-gray-400 hover:text-red-400 transition text-sm ml-auto">{{ _('Delete') }}</button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Load More -->
  <div x-show="!loading && hasMore" class="text-center mt-8">
    <button @click="loadMore()" class="bg-gray-800 hover:bg-gray-700 text-white px-6 py-2.5 rounded-xl transition">{{ _('Load More') }}</button>
  </div>
</main>
{% endblock %}

{% block scripts %}
<script>
function library() {
  return {
    tabs: [
      { id: 'all', label: 'All' },
      { id: 'songs', label: 'Songs' },
      { id: 'videos', label: 'Videos' },
      { id: 'drafts', label: 'Drafts' },
    ],
    activeTab: 'all',
    items: [],
    loading: true,
    offset: 0,
    limit: 20,
    hasMore: false,

    init() { this.load(); },

    async load() {
      this.loading = true;
      this.offset = 0;
      try {
        const res = await fetch(`/api/v1/library?tab=${this.activeTab}&limit=${this.limit}&offset=0`);
        const data = await res.json();
        this.items = data.items || [];
        this.hasMore = this.items.length >= this.limit;
      } catch (e) { console.error(e); }
      this.loading = false;
    },

    async loadMore() {
      this.offset += this.limit;
      try {
        const res = await fetch(`/api/v1/library?tab=${this.activeTab}&limit=${this.limit}&offset=${this.offset}`);
        const data = await res.json();
        this.items.push(...(data.items || []));
        this.hasMore = (data.items || []).length >= this.limit;
      } catch (e) { console.error(e); }
    },

    shareItem(item) {
      const url = `${window.location.origin}/creation/${item.id}`;
      navigator.clipboard.writeText(url);
      alert('{{ _("Link copied!") }}');
    },

    async deleteItem(id) {
      if (!confirm('{{ _("Delete this creation?") }}')) return;
      try {
        await fetch(`/api/v1/works/${id}`, { method: 'DELETE' });
        this.items = this.items.filter(i => i.id !== id);
      } catch (e) { console.error(e); }
    },

    formatDuration(ms) {
      if (!ms) return '--:--';
      const s = Math.floor(ms / 1000);
      const m = Math.floor(s / 60);
      return `${m}:${String(s % 60).padStart(2, '0')}`;
    },

    formatDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    },
  };
}
</script>
{% endblock %}
